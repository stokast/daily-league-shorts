<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#202024}</style></head>
<body>
<script type="module">
// Screen review harness: /tools/screens.html?ids=a,b&times=0.2,0.6,2&w=1280&cell=640
// Renders each screen module (src/screens/<id>.js) at each time into one sheet canvas.
import { loadFonts } from '/src/fonts.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || '').split(',').filter(Boolean);
const times = (q.get('times') || '0.3,0.8,2').split(',').map(Number);
const W = +(q.get('w') || 1280);
const cellW = +(q.get('cell') || 640);
await loadFonts();
const rows = [];
const stats = [];
for (const id of ids) {
  const mod = await import(`/src/screens/${id}.js?v=${Date.now()}`);
  const aspect = mod.meta.aspect || 16 / 9;
  const w = W, h = Math.round(W / aspect);
  let t0 = performance.now();
  const inst = mod.create(w, h);
  const tCreate = performance.now() - t0;
  const bg = document.createElement('canvas'); bg.width = w; bg.height = h;
  t0 = performance.now();
  inst.bg(bg.getContext('2d'));
  bg.getContext('2d').getImageData(0, 0, 1, 1);
  const tBg = performance.now() - t0;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const cells = [];
  let fgTotal = 0, fgN = 0;
  for (const t of times) {
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(bg, 0, 0);
    const t1 = performance.now();
    ctx.save(); inst.fg(ctx, t); ctx.restore();
    ctx.getImageData(0, 0, 1, 1);
    fgTotal += performance.now() - t1; fgN++;
    const cell = document.createElement('canvas'); cell.width = cellW; cell.height = Math.round(cellW * h / w);
    const cx = cell.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(c, 0, 0, cell.width, cell.height);
    cells.push(cell);
  }
  // extra fg timing (steady state)
  const t2 = performance.now();
  for (let i = 0; i < 10; i++) { ctx.drawImage(bg, 0, 0); ctx.save(); inst.fg(ctx, 3 + i / 30); ctx.restore(); ctx.getImageData(0, 0, 1, 1); }
  const fgSteady = (performance.now() - t2) / 10;
  stats.push(`${id}: create ${tCreate.toFixed(0)}ms bg ${tBg.toFixed(0)}ms fg(intro avg) ${(fgTotal / fgN).toFixed(1)}ms fg(steady, incl. bg blit) ${fgSteady.toFixed(1)}ms`);
  rows.push({ id, cells });
}
const pad = 12, label = 26;
const sheetW = pad + times.length * (cellW + pad);
const sheetH = pad + rows.reduce((a, r) => a + label + r.cells[0].height + pad, 0);
const sheet = document.createElement('canvas'); sheet.width = sheetW; sheet.height = sheetH;
const sx = sheet.getContext('2d');
sx.fillStyle = '#202024'; sx.fillRect(0, 0, sheetW, sheetH);
let y = pad;
for (const r of rows) {
  sx.fillStyle = '#ccc'; sx.font = '18px "Geist Mono"';
  r.cells.forEach((cell, i) => {
    sx.fillText(`${r.id}  t=${times[i]}s`, pad + i * (cellW + pad), y + 18);
    sx.drawImage(cell, pad + i * (cellW + pad), y + label);
  });
  y += label + r.cells[0].height + pad;
}
window.stats = stats;
window.sheet = sheet.toDataURL('image/png');
window.done = true;
</script></body></html>
